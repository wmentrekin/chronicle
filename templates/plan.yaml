# Contract: durable execution plan created by $work when the selected mode needs explicit planning

artifact: plan
feature: "<feature-slug>"
mode: "bounded-feature"
status: draft
owner_skill: work
based_on: "docs/<feature>/requirements.yaml"

objective: ""

approach:
  summary: ""
  key_decisions: []

contracts:
  interfaces: []
  schemas: []
  config_changes: []

branching:
  strategy: "single-branch"
  branch_name: ""
  worktrees: []

execution_batches:
  - id: "B1"
    goal: ""
    tasks:
      - id: "T1"
        title: ""
        objective: ""
        assigned_domain: ""
        model_routing:
          task_profile: "implementation"
          uncertainty: "medium"
          consequence: "medium"
          scope_size: "bounded"
          determinism: "interpretive"
          requested_tier: "balanced"
          requested_reasoning: "medium"
          provider_model: ""
          routing_enforced: false
          escalation_tier: "frontier"
          escalation_condition: ""
        owned_scope: []
        forbidden_scope: []
        dependencies: []
        parallelizable: false
        expected_validation: []

ordering_notes: []

risks: []

model_routing_notes: []

open_questions: []

review:
  status: draft
  loop_count: 0
  notes: []

checkpoint:
  required_before_execution: true
  status: pending
