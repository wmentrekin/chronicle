# Contract: task handoff from /implement to developer agents

artifact: task_handoff
feature: "stage3-identification-alternatives"
task_id: "T4"
owner_skill: implement

objective: "Implement `speechbrain_hybrid` by reusing the refmatch similarity matrix and calling local Ollama only for unresolved low-margin or conflicting assignments, with prompts bounded to candidate subsets."
why_this_matters: "T4 adds the comparison framework’s bounded hybrid backend without reopening the broader Ollama baseline or benchmark-reporting work. It should prove that low-confidence conflicts can be escalated locally while high-confidence embedding matches stay fully non-LLM."

inputs:
  requirements: "docs/stage3-identification-alternatives/requirements.yaml"
  plan: "docs/stage3-identification-alternatives/plan.yaml"
  relevant_paths:
    - "src/chronicle/stage3/refmatch.py"
    - "src/chronicle/stage3/service.py"
    - "src/chronicle/stage3/llm.py"
    - "src/chronicle/stage3/prompts.py"
    - "src/chronicle/stage3/schemas.py"
    - "tests/test_stage3.py"

scope:
  owned:
    - "src/chronicle/stage3/"
    - "tests/test_stage3.py"
  forbidden:
    - "src/chronicle/cli/"
    - "docs/"
    - "examples/"
    - "Benchmark/reporting logic"
    - "Changing `ollama_decomposed` baseline behavior"
    - "Fallback to full-session or full-manifest Ollama prompts"

implementation_notes:
  - "Reuse the existing refmatch similarity matrix and deterministic assignment thresholds where possible."
  - "Only unresolved speakers should trigger Ollama tie-break calls."
  - "Tie-break prompts must be limited to the candidate subset for the unresolved speaker, not the full participant set."
  - "High-confidence refmatch cases must not call Ollama."
  - "Keep the final output in the normalized speaker-map shape and preserve backend-generic metadata."

validation_expected:
  - "Monkeypatched tests proving high-confidence cases do not call Ollama."
  - "Tests for bounded prompt candidate subsets and low call count."
  - "Regression tests showing hybrid output still satisfies one-to-one speaker mapping rules."

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
