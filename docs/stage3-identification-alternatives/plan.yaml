# Contract: plan handoff from /plan and /refine to /implement, /review, /test, and /validate

artifact: plan
feature: "stage3-identification-alternatives"
status: draft
owner_skill: plan
based_on: "docs/stage3-identification-alternatives/requirements.yaml"

summary:
  objective: "Design and stage an evaluation-first implementation that makes multiple local Stage 3 identification backends selectable, comparable, and benchmarkable before any production default is changed."
  design_overview: "Introduce a Stage 3 backend abstraction behind `chronicle identify`, keep `manual` and `align-only` semantics unchanged, add participant voice-reference enrollment and deterministic embedding utilities for SpeechBrain-based alternatives, integrate the existing Ollama decomposition path as the local no-reference baseline, and add a benchmark command that runs selected backends on the same session to produce machine-readable and human-readable comparison reports plus a recommendation under a fixed accuracy-first selection rule."

decisions:
  - "Preserve Stage 3 boundaries: Stage 3 consumes Stage 1 transcript artifacts, Stage 2 diarization artifacts, participants metadata, manifest, context, and optionally participant voice-reference clips, but does not change Stage 1 or Stage 2 contracts."
  - "Add a backend selector to automatic Stage 3 identity assignment while keeping `--mode align-only` and `--mode manual` behavior unchanged."
  - "Implement three backend identifiers: `ollama_decomposed`, `speechbrain_refmatch`, and `speechbrain_hybrid`."
  - "Treat `ollama_decomposed` as the baseline automatic backend that can run without participant reference clips."
  - "Treat `speechbrain_refmatch` and `speechbrain_hybrid` as enrollment-dependent backends that require sufficient participant `voice_references` in `inputs/global/participants.yaml`."
  - "Use SpeechBrain ECAPA embeddings as the first non-LLM speaker-comparison implementation."
  - "Keep Stage 3 output artifact filenames unchanged and extend metadata with backend-generic fields instead of replacing existing artifacts."
  - "Use deterministic one-to-one assignment logic and fail closed on insufficient enrollment coverage, ambiguous conflicts, or low-confidence similarity results."
  - "Bound any hybrid Ollama use to unresolved low-margin conflicts only; high-confidence embedding matches must not call Ollama."
  - "Use one curated labeled evaluation session or slice as the fixed decision set for backend comparison before any default-backend change is considered."
  - "Apply a fixed recommendation rule in benchmark reporting: choose the highest-accuracy backend; if two backends are within 2 percentage points on exact speaker-label assignment accuracy, recommend the faster or lighter backend."
  - "Do not switch the production default backend in this phase; produce a recommendation artifact only."

contracts:
  interfaces:
    - "Extend `chronicle identify <session_id>` with `--backend` for automatic identity-assignment paths. Supported values: `ollama_decomposed`, `speechbrain_refmatch`, `speechbrain_hybrid`."
    - "Keep `chronicle identify --mode manual` and `chronicle identify --mode align-only` stable; backend selection applies only when automatic speaker assignment is requested."
    - "Add `chronicle benchmark-stage3 <session_id> --backends ...` to execute selected Stage 3 backends sequentially and write comparison artifacts under the session run directory."
    - "Expose a Stage 3 backend interface in code that accepts the normalized aligned Stage 3 inputs and returns the canonical `speaker_map` shape plus backend usage metadata and notes."
  schemas:
    - "Extend participant records in `inputs/global/participants.yaml` with optional `voice_references`, a list of repo-relative audio clip paths used for enrollment."
    - "Keep Stage 3 artifact filenames and top-level transcript block structure unchanged: `identified_conversation.*` and `aligned_transcript.*`."
    - "Add backend-generic Stage 3 artifact metadata fields: `backend` and `backend_usage`."
    - "Retain `llm_usage` only for backends that actually invoke Ollama."
    - "Add benchmark report artifacts in JSON and Markdown with backend results, exact speaker-label assignment accuracy, runtime summaries, per-step diagnostics, enrollment coverage, CPU-feasibility notes, failure details, and a recommendation."
  config_changes:
    - "Add backend selection defaults and validation in Stage 3 CLI/service wiring without changing existing `--mode` defaults."
    - "Add deterministic embedding-cache storage under untracked Stage 3 output or run directories only; no tracked repository files may be mutated by runtime caching."
    - "Add threshold and margin configuration constants for similarity acceptance and hybrid tie-break triggers in Stage 3 code."

tasks:
  - id: "T1"
    title: "Define Stage 3 backend abstraction and participant enrollment parsing"
    objective: "Refactor Stage 3 automatic assignment behind an explicit backend contract and add optional participant `voice_references` loading without breaking current manual or alignment flows."
    owned_scope:
      - "src/chronicle/stage3/service.py"
      - "src/chronicle/stage3/inputs.py"
      - "src/chronicle/stage3/schemas.py"
      - "src/chronicle/cli/stage3.py"
      - "tests/test_stage3.py"
    forbidden_scope:
      - "Stage 1 transcription logic"
      - "Stage 2 diarization logic"
      - "Default backend selection policy change"
    dependencies: []
    parallelizable: false
    expected_validation:
      - "Unit tests for parsing participant `voice_references`."
      - "Unit tests for backend selection and unsupported-backend errors."
      - "Regression tests showing `manual` and `align-only` behavior remains unchanged."

  - id: "T2"
    title: "Build deterministic enrollment and speaker-embedding preparation utilities"
    objective: "Add filesystem-based utilities to resolve reference clips and speaker audio slices, extract deterministic SpeechBrain ECAPA embeddings, and cache those results locally for reuse across backend runs."
    owned_scope:
      - "src/chronicle/stage3/ (new enrollment/embedding utility modules as needed)"
      - "tests/test_stage3.py or focused new Stage 3 utility tests"
    forbidden_scope:
      - "CLI behavior unrelated to Stage 3"
      - "Hosted or remote embedding services"
      - "Tracked-file cache storage"
    dependencies:
      - "T1"
    parallelizable: false
    expected_validation:
      - "Unit tests for missing, invalid, or out-of-repo reference audio handling."
      - "Unit tests for deterministic cache-key generation and ordering."
      - "Smoke validation that local embedding generation writes only to untracked output/run storage."

  - id: "T3"
    title: "Implement `speechbrain_refmatch` deterministic one-to-one assignment"
    objective: "Use participant reference embeddings and anonymous speaker embeddings to compute similarity scores, then assign canonical participants with deterministic one-to-one matching and strict fail-closed thresholds."
    owned_scope:
      - "Stage 3 backend implementation for `speechbrain_refmatch`"
      - "Similarity scoring and assignment logic"
      - "Synthetic backend tests"
    forbidden_scope:
      - "Hybrid Ollama tie-break behavior"
      - "Changing transcript or block rendering behavior"
      - "Relaxing one-to-one identity policy"
    dependencies:
      - "T1"
      - "T2"
    parallelizable: true
    expected_validation:
      - "Synthetic tests for clean match, ambiguous match, low-confidence failure, and duplicate-best-match conflict."
      - "Artifact-level regression showing canonical `speaker_map` shape is preserved."

  - id: "T4"
    title: "Implement `speechbrain_hybrid` bounded tie-break flow"
    objective: "Reuse the SpeechBrain similarity matrix but call local Ollama only for unresolved low-margin or conflicting assignments, with prompts restricted to the candidate subset needed for tie-break."
    owned_scope:
      - "Stage 3 backend implementation for `speechbrain_hybrid`"
      - "Hybrid tie-break prompt construction and invocation rules"
      - "Hybrid-specific tests"
    forbidden_scope:
      - "Fallback to full-session or full-manifest Ollama prompts"
      - "Invoking Ollama for high-confidence embedding matches"
      - "Changing `ollama_decomposed` baseline behavior"
    dependencies:
      - "T1"
      - "T2"
      - "T3"
    parallelizable: false
    expected_validation:
      - "Monkeypatched tests proving high-confidence cases do not call Ollama."
      - "Tests for prompt-size bounds and per-conflict call counts."
      - "Regression tests that hybrid output still satisfies one-to-one speaker mapping rules."

  - id: "T5"
    title: "Integrate `ollama_decomposed` baseline into the backend framework"
    objective: "Adapt the existing decomposed Stage 3 Ollama implementation to the new backend interface so it remains the local no-reference comparison baseline."
    owned_scope:
      - "src/chronicle/stage3/llm.py"
      - "Stage 3 backend adapter/wiring for `ollama_decomposed`"
      - "Existing Ollama tests and adapter regressions"
    forbidden_scope:
      - "New prompt decomposition design beyond what the existing plan already defines"
      - "Changing manual mode semantics"
      - "Changing production default backend"
    dependencies:
      - "T1"
    parallelizable: true
    expected_validation:
      - "Existing Stage 3 Ollama tests continue to pass."
      - "Backend-adapter tests verify baseline backend selection and metadata shape."

  - id: "T6"
    title: "Add benchmark runner, report generation, and recommendation logic"
    objective: "Run multiple Stage 3 backends sequentially on the same labeled evaluation session or slice, isolate backend failures, and emit deterministic comparison reports plus a recommendation under the fixed winner-selection rule."
    owned_scope:
      - "src/chronicle/cli/benchmark.py"
      - "Stage 3 benchmark/report module(s)"
      - "Benchmark report tests"
    forbidden_scope:
      - "Changing Stage 3 production default"
      - "Mutating Stage 1 or Stage 2 artifacts"
      - "Silently suppressing backend failures in reports"
    dependencies:
      - "T3"
      - "T4"
      - "T5"
    parallelizable: false
    expected_validation:
      - "Report generation tests for JSON and Markdown artifacts."
      - "Deterministic ranking tests using fixed mock backend results."
      - "Failure-isolated reporting tests proving one backend failure does not abort the full benchmark run."
      - "Recommendation logic tests covering the 2-percentage-point tie-break rule."
      - "Report tests proving enrollment coverage, CPU-feasibility notes, and per-backend diagnostics are preserved."

  - id: "T7"
    title: "Wire CLI, artifact metadata, and run-record integration"
    objective: "Expose backend selection on the identify CLI, persist backend metadata in Stage 3 artifacts and run records, and keep current filenames and transcript content stable."
    owned_scope:
      - "src/chronicle/cli/stage3.py"
      - "src/chronicle/stage3/artifacts.py"
      - "src/chronicle/stage3/service.py"
      - "tests/test_stage3.py"
    forbidden_scope:
      - "Renaming Stage 3 output artifacts"
      - "Changing transcript text or Stage 2 provenance"
      - "Default backend switch"
    dependencies:
      - "T3"
      - "T4"
      - "T5"
    parallelizable: true
    expected_validation:
      - "CLI argument tests for `--backend`."
      - "Artifact schema tests for each backend family."
      - "Run-metadata regression tests covering backend-specific fields."

  - id: "T8"
    title: "Document comparison workflow and evaluation gate"
    objective: "Update current-state docs so backend selection, participant enrollment, benchmark outputs, and recommendation-only rollout policy are explicit for future refine and implementation work."
    owned_scope:
      - "docs/stages/stage3-identification.md"
      - "docs/cli.md"
      - "docs/artifacts.md"
      - "examples/inputs/global/participants.yaml"
    forbidden_scope:
      - "Claiming a new production default before benchmark evidence exists"
      - "Documenting hosted or remote identification paths"
      - "Changing requirements or scope in docs"
    dependencies:
      - "T6"
      - "T7"
    parallelizable: true
    expected_validation:
      - "Doc review against implemented interfaces and artifact fields."
      - "Example participant metadata includes valid `voice_references` shape."

execution:
  order:
    - "T1"
    - "T2"
    - "T3 + T5"
    - "T4"
    - "T6 + T7"
    - "T8"
  notes:
    - "T1 must land first because every automatic backend and CLI/report surface depends on the backend contract and participant-enrollment parsing."
    - "T2 stays ahead of the SpeechBrain backends to keep audio slicing, embedding extraction, and cache semantics consistent across `speechbrain_refmatch` and `speechbrain_hybrid`."
    - "T3 and T5 can proceed in parallel after T1 because they implement separate automatic backend families against the same interface."
    - "T4 depends on T3 because hybrid behavior should reuse the same similarity matrix and acceptance thresholds before adding Ollama tie-break logic."
    - "T6 and T7 can proceed together once backend implementations are stable because benchmark reporting and final artifact wiring depend on final backend metadata shapes."
    - "T8 should be last so docs describe the implemented contracts rather than pre-implementation guesses."

risks:
  - "SpeechBrain embedding extraction may impose optional dependency or runtime setup constraints that need to stay isolated from the base install."
  - "Participant `voice_references` may be incomplete, noisy, or invalid; enrollment-dependent backends must fail explicitly without breaking the Ollama baseline."
  - "Similarity thresholds that are too permissive or too strict can distort benchmark comparisons; threshold behavior needs deterministic tests and visible diagnostics."
  - "Hybrid tie-break prompts can drift into large-context Ollama calls unless candidate subsets and trigger rules are hard-bounded."
  - "Benchmark results are hardware-sensitive on the target 8 GB CPU-only machine, so reports must capture runtime and CPU-feasibility notes rather than treating one run as universally representative."
  - "Caching embeddings in tracked paths would violate repo data-handling expectations; cache placement must remain under ignored output/run directories."
  - "If the labeled evaluation fixture is weak or unrepresentative, recommendation quality will be misleading even if the benchmark mechanics are correct."

open_questions:
  - "None. The planning phase assumes one curated labeled evaluation session will be prepared as the decision set before any default-backend change is considered."

approval:
  refine_status: approved_with_changes
  review_cycles: 1
  approved_for_implementation: true
