# Contract: task handoff from /implement to developer agents

artifact: task_handoff
feature: "stage3-identification-alternatives"
task_id: "T1"
owner_skill: implement

objective: "Refactor Stage 3 automatic assignment behind an explicit backend contract and add optional participant `voice_references` loading without breaking current manual or alignment flows."
why_this_matters: "T1 is the first required dependency for all later Stage 3 backend work. It establishes the backend-selection surface and participant-enrollment parsing that later SpeechBrain and benchmark tasks rely on."

inputs:
  requirements: "docs/stage3-identification-alternatives/requirements.yaml"
  plan: "docs/stage3-identification-alternatives/plan.yaml"
  relevant_paths:
    - "src/chronicle/stage3/service.py"
    - "src/chronicle/stage3/inputs.py"
    - "src/chronicle/stage3/schemas.py"
    - "src/chronicle/cli/stage3.py"
    - "tests/test_stage3.py"

scope:
  owned:
    - "src/chronicle/stage3/service.py"
    - "src/chronicle/stage3/inputs.py"
    - "src/chronicle/stage3/schemas.py"
    - "src/chronicle/cli/stage3.py"
    - "tests/test_stage3.py"
  forbidden:
    - "src/chronicle/stage1/"
    - "src/chronicle/stage2/"
    - "docs/"
    - "examples/"
    - "Default backend selection policy change"

implementation_notes:
  - "Keep `--mode manual` and `--mode align-only` behavior stable."
  - "Backend selection applies only to automatic identity-assignment paths."
  - "Add supported backend identifiers `ollama_decomposed`, `speechbrain_refmatch`, and `speechbrain_hybrid` with explicit validation errors for unsupported values."
  - "Generalize Stage 3 metadata from Ollama-only usage toward backend-generic fields, but do not implement SpeechBrain matching logic in this task."
  - "Participant `voice_references` parsing should be optional and non-breaking for existing participant records."
  - "Do not change Stage 3 output filenames or Stage 1/Stage 2 contracts in this task."

validation_expected:
  - "Unit tests for parsing participant `voice_references`."
  - "Unit tests for backend selection and unsupported-backend errors."
  - "Regression tests showing `manual` and `align-only` behavior remains unchanged."

escalate_if:
  - missing_context
  - conflicting_artifacts
  - product_or_architecture_guess_required
  - scope_expansion_required
