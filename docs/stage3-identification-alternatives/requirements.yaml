# Contract: requirements handoff from /discover to /plan and /refine

artifact: requirements
feature: "stage3-identification-alternatives"
status: frozen
owner_skill: discover

summary:
  problem: "Current Stage 3 identification relies on local Ollama `llm` mode or manual mapping. On the target 8 GB CPU-only machine, the local Ollama path has timed out with both `qwen3:8b` and `gemma3:4b`, and the user wants to explore an approach that works better than the current state or uses an entirely different non-LLM method."
  motivation: "Stage 3 needs a practical local identification path that is more reliable, more efficient, and easier to operate than the current LLM-assisted baseline."
  requested_outcome: "Compare multiple local Stage 3 identification alternatives, including non-LLM and alternative local model approaches, and freeze requirements for a replacement or improvement path that prioritizes identification accuracy first and local runtime practicality second."

goals:
  - "Define the exact scope of the Stage 3 identification improvement task."
  - "Compare multiple local alternatives before choosing an implementation direction."
  - "Preserve Chronicle stage boundaries: Stage 1 transcribes, Stage 2 diarizes, Stage 3 identifies canonical participants."
  - "Keep the resulting approach local-first and suitable for the current hardware target unless explicitly changed."
  - "Allow discovery to consider both LLM-assisted and non-LLM approaches, with the expectation that the current Ollama decomposition path is likely less favorable but still a valid comparison point."
  - "Allow the candidate Stage 3 method to use any combination of currently available evidence: Stage 1 transcript, Stage 2 diarization, manifest/context, raw audio, speaker embeddings, or reference voice samples."
  - "Prioritize identification accuracy above all other criteria."
  - "Prioritize runtime speed and CPU feasibility immediately after accuracy."
  - "Produce requirements strong enough for downstream planning."

non_goals:
  - "Do not design the solution yet."
  - "Do not change Stage 1 transcription in this discovery pass."
  - "Do not change Stage 2 diarization in this discovery pass."
  - "Do not implement code changes."
  - "Do not prematurely lock the project into either LLM or non-LLM methods before alternatives are compared."

constraints:
  technical:
    - "Stage 3 currently consumes Stage 1 transcript artifacts, Stage 2 diarization artifacts, participants metadata, session manifest, and context."
    - "Current public Stage 3 contract writes identified_conversation.* or aligned_transcript.* artifacts."
    - "Current Stage 3 implementation is local-first and should not silently fall back to hosted APIs."
    - "The user's current machine constraint is an 8 GB CPU-only environment."
  product:
    - "Stage 3 should continue assigning only canonical manifest participants."
    - "Stage 3 should preserve Stage 1 wording and Stage 2 provenance."
    - "The user is explicitly interested in methods that work better than current state and is open to both non-LLM and alternative LLM options."
    - "Accuracy is the top success criterion."
    - "Runtime speed and CPU feasibility are the next success criteria after accuracy."
    - "Setup simplicity and reproducibility are lower priority for this phase."
  process:
    - "This /discover phase should produce requirements only."
    - "Requirements should be frozen before planning begins."

assumptions:
  - "Stage 3 remains the identification stage rather than moving identity work into Stage 2."
  - "Local-first behavior remains a core project requirement."
  - "The current Stage 3 Ollama decomposition plan is prior art and should remain a candidate comparison point, but not the favored default."
  - "The future Stage 3 implementation may use raw audio-derived speaker features if that improves identification accuracy while preserving stage boundaries."

repo_context:
  relevant_paths:
    - "docs/stages/stage3-identification.md"
    - "docs/plans/stage3-ollama-decomposition.md"
    - "src/chronicle/stage3/"
    - "tests/test_stage3.py"
    - "agent-context/decisions/stage-boundaries.md"
    - "agent-context/decisions/local-first-model-policy.md"
  systems_in_scope:
    - "Stage 3 identification"
    - "Stage 3 artifact contract"
    - "Stage 3 local runtime behavior"
  prior_artifacts:
    - "docs/plans/stage3-ollama-decomposition.md"

research:
  repo_findings:
    - "Current Stage 3 modes are `llm`, `manual`, and `align-only`."
    - "Current `llm` mode uses local Ollama."
    - "The current Stage 3 plan assumes a decomposed Ollama workflow but still remains LLM-assisted."
    - "The user has now asked to compare multiple local alternatives, including non-LLM and alternative local model approaches, before choosing one."
  platform_findings:
    - "pyannote Community-1 is a local/offline diarization pipeline, but pyannote's advanced speaker identification via voiceprints is positioned on the commercial/hosted side rather than the open local community path. Source: https://docs.pyannote.ai/models and https://huggingface.co/pyannote-community/speaker-diarization-community-1"
    - "SpeechBrain provides local speaker-verification and speaker-embedding models such as `speechbrain/spkrec-ecapa-voxceleb`, suitable for embedding extraction and same-speaker scoring. Source: https://huggingface.co/speechbrain/spkrec-ecapa-voxceleb"
    - "WeSpeaker is a local speaker toolkit with embedding, similarity, and diarization support, and can be used from Python or CLI. Source: https://github.com/wenet-e2e/wespeaker"
    - "NVIDIA NeMo TitaNet provides local speaker embeddings and verification, and is explicitly positioned as a backbone for speaker verification and diarization. Source: https://huggingface.co/nvidia/speakerverification_en_titanet_large"

acceptance_criteria:
  - "Requirements clearly define the task as a comparison of multiple local Stage 3 identification alternatives before selecting an implementation path."
  - "Requirements clearly state that both non-LLM and local LLM-assisted methods are in scope."
  - "Requirements clearly state that Stage 3 may use transcript, diarization, manifest/context, raw audio, speaker embeddings, and reference voice samples if needed."
  - "Requirements clearly state the metric priority order: identification accuracy first; runtime speed and CPU feasibility second; setup simplicity and reproducibility later."
  - "Requirements clearly state that the current Ollama decomposition plan remains in scope as a comparison candidate but is not the preferred assumption."
  - "Requirements are specific enough for `/plan` to produce an evaluation and selection plan without reopening basic scope questions."

open_questions: []

freeze:
  ready_for_plan: true
  blockers: []
