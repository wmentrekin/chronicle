# Contract: live coordination artifact maintained by $work

artifact: status
feature: "<feature-slug>"
mode: "quick-fix"
stage: "discovery"
owner_skill: work

objective: ""

repository_sync:
  completed_before_work: false
  checked_at: ""
  repositories:
    - path: ""
      remote: ""
      relevant_branch: ""
      local_commit_before: ""
      remote_commit_after_fetch: ""
      local_commit_after: ""
      result: "current"
      notes: ""

branching:
  branch_name: ""

summary:
  current_focus: ""
  last_completed: ""
  current_blocker: ""

artifacts:
  requirements: null
  plan: null
  implementation_report: null

pr:
  number: null
  url: null
  status: "not_opened"

agents:
  - id: "orchestrator"
    role: "orchestrator"
    task_profile: "orchestration"
    requested_model_tier: "frontier"
    requested_reasoning: "high"
    requested_provider_model: ""
    actual_model: ""
    actual_reasoning: ""
    routing_enforced: false
    escalation_count: 0
    status: "active"
    stage: "discovery"
    task: ""
    last_update: ""
    blocker: ""

loops:
  planning_review:
    count: 0
    max: 2
  execution_verification:
    count: 0
    max: 2

