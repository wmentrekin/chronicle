  pre_execution_required: true
  pre_execution_status: pending
  options:
    - proceed
    - revise_plan
    - narrow_scope
    - stop

blockers: []
decisions: []

model_routing:
  provider: ""
  provider_map_verified_at: ""
  substitutions: []
